name: 홈페이지 배포
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"      # 매시간 — 블로그 새 글과 관리페이지에서 고친 내용 반영
  workflow_dispatch:        # 필요할 때 손으로 실행
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python build.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v5
        continue-on-error: true   # GitHub가 방금 올린 파일을 바로 못 찾는 일이 있어 한 번 더 시도합니다
      - if: steps.deploy.outcome == 'failure'
        run: sleep 60
      - id: retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
