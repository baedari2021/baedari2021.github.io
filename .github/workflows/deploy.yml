name: 홈페이지 배포
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 21 * * *"   # 매일 한국시간 06:00 — 블로그 새 글과 관리페이지 공개 자료 반영
  workflow_dispatch:        # 필요할 때 손으로 실행
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
